name: hiCanvas checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: 基础检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check -- --base "$HICANVAS_CHECK_BASE"
        env:
          HICANVAS_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
